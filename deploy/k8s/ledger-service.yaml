# Two replicas on purpose: per-account Redis locks, the event store's version check and the
# outbox relay's FOR UPDATE SKIP LOCKED are what keep two instances from double-writing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledger-service}
  template:
    metadata:
      labels: {app: ledger-service}
    spec:
      # Flyway migrates on startup and the outbox relay needs Kafka, so wait for the
      # dependencies instead of crash-looping until they are up.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              for dep in postgres:5432 redis:6379 kafka:9092; do
                until nc -z -w 2 "${dep%%:*}" "${dep##*:}"; do echo "waiting for $dep"; sleep 2; done
              done
      containers:
        - name: ledger-service
          image: nexledger/ledger-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: nexledger-config}
            - secretRef: {name: nexledger-db}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
spec:
  selector: {app: ledger-service}
  ports: [{port: 8080}]
