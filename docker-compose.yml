version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexledger-postgres
    environment:
      POSTGRES_DB: nexledger
      POSTGRES_USER: nexledger
      POSTGRES_PASSWORD: nexledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexledger -d nexledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexledger-net

  redis:
    image: redis:7-alpine
    container_name: nexledger-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexledger-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexledger-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nexledger-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexledger-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nexledger-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexledger-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account-events --partitions 6 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction-events --partitions 6 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic saga-events --partitions 3 --replication-factor 1 &&
        echo 'Topics created successfully'
      "
    networks:
      - nexledger-net

  fraud-service:
    build:
      context: ./fraud-service
      dockerfile: Dockerfile
    container_name: nexledger-fraud
    environment:
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models/fraud_model.json
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexledger-net

  ledger-service:
    build:
      context: ./ledger-service
      dockerfile: Dockerfile
    container_name: nexledger-ledger
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexledger
      DB_USER: nexledger
      DB_PASS: nexledger
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      FRAUD_SERVICE_URL: http://fraud-service:8090
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - nexledger-net

volumes:
  postgres_data:
  redis_data:

networks:
  nexledger-net:
    driver: bridge
